name: kosh
description: "Offline only music player."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  inspire_blur: ^0.4.0
  on_audio_query: ^2.9.0
  permission_handler: ^13.0.1
  path_provider: ^2.1.0
  flutter_taglib: ^1.5.2
  figma_squircle: ^0.6.3
  flutter_marquee_plus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/noise.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
